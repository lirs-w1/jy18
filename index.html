<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人名片</title>
    <!-- 引入外部样式表，保持 HTML 与 CSS 分离 -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-wrap">
      <!-- 名片主体 -->
      <section class="business-card" aria-label="个人名片">
        <!-- 头像区域 -->
        <div class="avatar-wrap">
          <img
            class="avatar"
            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80"
            alt="个人头像"
          />
        </div>

        <!-- 基本信息 -->
        <div class="info">
          <h1 class="name">pink</h1>
          <p class="title">产品设计师 / UI 视觉设计</p>
        </div>

        <!-- 联系方式 -->
        <ul class="contact-list" aria-label="联系方式">
          <li><span>📧</span><a href="mailto:linzhiqiu@example.com">linzhiqiu@example.com</a></li>
          <li><span>📱</span><a href="tel:+8613800000000">+86 138 0000 0000</a></li>
          <li><span>🌐</span><a href="https://example.com" target="_blank" rel="noreferrer">www.example.com</a></li>
        </ul>
      </section>
    </main>
  </body>
</html>
